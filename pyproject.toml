[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-phases-portfolio"
version = "0.1.0"
description = "Few-shot quantum phase classification: generative augmentation versus simple controls"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["quantum_phases*", "C_GAN*", "C_difusion*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
